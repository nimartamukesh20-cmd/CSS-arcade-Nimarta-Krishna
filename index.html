<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Arcade Cabinet — Activity 05 build challenge">
  <title>Retro Tic-Tac-Toe Cabinet</title>

  <!--
    Activity 05 · CSS Arcade Night · Round 3 Build
    Team Name: Nimarta/Krishna
    Members / IDs: Nimarta: 002834571 Krishna:002739083
    Theme: Retro Tic-Tac-Toe Cabinet
  -->

  <style>
    /* ==================================================
       0. DESIGN TOKENS — Checkpoint 6
       ================================================== */
    :root {
      --bg: #0c0a1a;
      --surface: #16132b;
      --ink: #f8fafc;
      --neon-pink: #f472b6;
      --neon-cyan: #22d3ee;
      --radius: 14px;
      --space: 1rem;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 2rem;
    }

    section {
      margin-bottom: 3rem;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--neon-cyan);
    }

    /* ==================================================
       1. FLEXBOX — Checkpoint 1
       ================================================== */
    .cabinet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: var(--space);
      border-bottom: 2px solid var(--neon-cyan);
    }

    .logo {
      color: var(--neon-pink);
    }

    .cabinet-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
    }

    .cabinet-nav a {
      color: var(--ink);
      text-decoration: none;
      transition: transform 0.25s, color 0.25s;
    }

    /* ==================================================
       2. CSS GRID — Checkpoint 2
       ================================================== */
    .game-board {
      position: relative;
      max-width: 500px;
      margin: auto;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .tile {
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--surface);
      border: 2px solid var(--neon-cyan);
      border-radius: var(--radius);
      padding: var(--space);
      min-height: 120px;
      font-size: 3rem;
      font-weight: bold;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .x {
      color: var(--neon-pink);
    }

    .o {
      color: var(--neon-cyan);
    }

    /* ==================================================
       3. KEYFRAME ANIMATION — Checkpoint 3
       ================================================== */
    .winning-line {
      position: absolute;
      top: 49%;
      left: 5%;
      width: 90%;
      height: 8px;
      background: var(--neon-pink);
      box-shadow: 0 0 15px var(--neon-pink);
      z-index: 4;

      animation-name: winningMove;
      animation-duration: 2s;
      animation-delay: 0.5s;
      animation-fill-mode: forwards;
      transform-origin: left;
    }

    @keyframes winningMove {
      0% {
        transform: scaleX(0);
        opacity: 0;
      }

      50% {
        transform: scaleX(0.5);
        opacity: 1;
      }

      100% {
        transform: scaleX(1);
        opacity: 1;
      }
    }

    /* ==================================================
       4. POSITIONING + Z-INDEX — Checkpoint 4
       ================================================== */
    .layer-stack {
      position: relative;
      min-height: 260px;
      max-width: 500px;
      margin: auto;
    }

    .layer {
      position: absolute;
      width: 260px;
      padding: 2rem;
      border-radius: var(--radius);
      text-align: center;
      font-weight: bold;
    }

    .layer-back {
      top: 60px;
      left: 80px;
      background: var(--neon-cyan);
      color: var(--bg);
      z-index: 1;
    }

    .layer-mid {
      top: 90px;
      left: 120px;
      background: var(--surface);
      border: 2px solid var(--neon-pink);
      z-index: 2;
    }

    .layer-front {
      top: 120px;
      left: 160px;
      background: var(--neon-pink);
      color: var(--bg);
      z-index: 3;
    }

    /* ==================================================
       5. MICRO-INTERACTION — Checkpoint 5
       ================================================== */
    .tile:hover,
    .tile:focus-visible {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 0 20px var(--neon-cyan);
      outline: 3px solid var(--neon-pink);
    }

    .cabinet-nav a:hover,
    .cabinet-nav a:focus-visible {
      color: var(--neon-pink);
      transform: translateY(-2px);
      outline: 2px solid var(--neon-cyan);
    }

    .score-list {
      max-width: 350px;
      margin: auto;
      padding-left: 2rem;
      font-size: 1.2rem;
    }

    .cabinet-footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 2px solid var(--neon-pink);
    }

    /* ==================================================
       6. RESPONSIVE DESIGN — Checkpoint 6
       ================================================== */
    @media (max-width: 768px) {
      .cabinet-header {
        flex-direction: column;
        gap: 1rem;
      }

      .game-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .tile {
        min-height: 90px;
      }

      .layer {
        width: 200px;
      }

      .layer-back {
        left: 10px;
      }

      .layer-mid {
        left: 40px;
      }

      .layer-front {
        left: 70px;
      }
    }
  </style>
</head>

<body>

  <header class="cabinet-header">
    <h1 class="logo">🕹️ Retro Tic-Tac-Toe</h1>

    <nav class="cabinet-nav" aria-label="Cabinet navigation">
      <a href="#play">Play</a>
      <a href="#scores">High Scores</a>
      <a href="#winner">Winner</a>
    </nav>
  </header>

  <main>

    <section id="play" aria-labelledby="play-title">
      <h2 id="play-title">Press Start</h2>

      <div class="game-board">

        <div class="game-grid">
          <div class="tile x" tabindex="0">X</div>
          <div class="tile o" tabindex="0">O</div>
          <div class="tile x" tabindex="0">X</div>

          <div class="tile o" tabindex="0">O</div>
          <div class="tile x" tabindex="0">X</div>
          <div class="tile o" tabindex="0">O</div>

          <div class="tile x" tabindex="0">X</div>
          <div class="tile o" tabindex="0">O</div>
          <div class="tile x" tabindex="0">X</div>
        </div>

        <div class="winning-line"></div>

      </div>
    </section>

    <section id="scores" aria-labelledby="scores-title">
      <h2 id="scores-title">High Scores</h2>

      <ol class="score-list">
        <li>AAA · 9,999</li>
        <li>BBB · 7,500</li>
        <li>CCC · 5,000</li>
      </ol>
    </section>

    <section id="winner" aria-labelledby="winner-title">
      <h2 id="winner-title">Winner</h2>

      <div class="layer-stack">
        <div class="layer layer-back">
          GAME OVER
        </div>

        <div class="layer layer-mid">
          TIC-TAC-TOE
        </div>

        <div class="layer layer-front">
          PLAYER 1 WINS!
        </div>
      </div>
    </section>

  </main>

  <footer class="cabinet-footer">
    <p>&copy; 2026 Nimarta/Krishna · Activity 05</p>
  </footer>

</body>
</html>
